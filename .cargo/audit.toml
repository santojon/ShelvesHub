# cargo-audit configuration (tracked: CI's `cargo audit` reads it from here).
#
# The daemon and its CLI have no advisories. The two ignores below are advisory
# WARNINGS (unmaintained / unsound), not vulnerabilities, and come only from the
# OPTIONAL tray companion (`--features tray`): `tray-icon` + `tao`, the macOS /
# Windows tray crates, carry a GTK3 (gtk-rs 0.18) Linux backend. This crate never
# compiles that backend — the Linux tray is `ksni`, and `tray-icon`/`tao` are
# dependencies only on non-Linux targets — but Cargo.lock lists the dependencies
# of every target, so cargo-audit still sees them. Reviewed and accepted:
#
#   RUSTSEC-2024-0370  proc-macro-error 1.0.4 unmaintained — a build-time macro
#                      dep of glib-macros 0.18 (via gtk 0.18); no runtime exposure.
#   RUSTSEC-2024-0429  glib 0.18.5 VariantStrIter unsoundness — fixed in glib
#                      0.20; nothing here uses the affected iterator.
#
# Re-check when tray-icon / tao move to gtk-rs >= 0.20 (glib 0.20 drops both
# crates from the tree), and drop whichever ignore no longer applies.
[advisories]
ignore = ["RUSTSEC-2024-0370", "RUSTSEC-2024-0429"]
