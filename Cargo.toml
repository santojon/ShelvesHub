[package]
name = "shelveshub"
version = "0.4.1"
edition = "2021"
description = "A cross-platform loader for Deck Shelves"
license = "MIT"

# Shared library: the CDP client, config, logger and state are reused by both
# the background loader service and the `shelves-devtools` CLI.
[lib]
name = "shelveshub"
path = "src/lib.rs"

# The background service that injects the bundle into the Steam CEF renderer.
[[bin]]
name = "shelveshub"
path = "src/main.rs"

# Cross-platform developer tool: a thin CDP client to inspect/inject/debug the
# Steam (or any Chromium) renderer from Linux, macOS or Windows.
[[bin]]
name = "shelves-devtools"
path = "src/bin/devtools.rs"

# Optional cross-OS tray companion. Behind the `tray` feature so the daemon and
# its CI never pull the GUI dependency tree; built and shipped separately, and
# installed only when the user opts in. Talks to the daemon over its local RPC.
[[bin]]
name = "shelveshub-tray"
path = "src/bin/tray.rs"
required-features = ["tray"]

[dependencies]
# All third-party crates below are dual-licensed MIT OR Apache-2.0, which is
# compatible with this project's MIT license. See docs/debugging.md.
chrono = "0.4"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking WebSocket client for the Chrome DevTools Protocol. ws:// only
# (localhost / SSH-tunnelled), so TLS backends are intentionally disabled.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
clap = { version = "4", features = ["derive", "env"] }
# Supply-chain verification of self-update downloads: SHA-256 of the archive +
# minisign signature check of the release's SHA256SUMS (public key baked in below).
sha2 = "0.10"
minisign-verify = "0.2"

# Tray companion only (feature `tray`). `png` decodes the embedded icon on every
# OS; the tray backend is per-OS (below). All optional so the daemon never pulls them.
png = { version = "0.17", optional = true }

# macOS + Windows tray: tray-icon + a tao event loop to drive it.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.21", optional = true }
tao = { version = "0.34", optional = true }

# Linux tray: ksni — a pure-Rust StatusNotifierItem (zbus), which the KDE/SteamOS
# panel hosts natively. No gtk / appindicator / xdo, and cross-compilable.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true, default-features = false, features = ["blocking", "async-io"] }

[features]
# Builds the `shelveshub-tray` companion and its per-OS tray backend.
tray = ["dep:png", "dep:tray-icon", "dep:tao", "dep:ksni"]

# Lints, enforced the same way in CI (`cargo clippy -- -D warnings`) and locally.
# Kept adequate — not maximally pedantic — for a small, dependency-light daemon.
[lints.rust]
unsafe_code = "forbid"        # the daemon and CLI need no unsafe
unused_must_use = "deny"      # never silently drop a Result
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
# Prefer inline format args (`{x}` over `{}`, x) — matches the codebase style.
uninlined_format_args = "warn"
