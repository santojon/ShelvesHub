name: "[FEATURE] Feature Request"
description: Suggest a new capability for ShelvesHub
title: "[FEATURE] "
labels: ["type::feature"]
body:
  - type: markdown
    attributes:
      value: |
        **Before submitting:** check if a similar request already exists.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The use case or pain point behind the request.
      placeholder: I want to... so that...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like ShelvesHub to do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps explain the request.
    validations:
      required: false
