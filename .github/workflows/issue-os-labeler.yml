name: "Triage · Label OS / host mode"

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Detect OS / channel / host-mode labels
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue?.title ?? "").toLowerCase();
            const body  = (context.payload.issue?.body  ?? "").toLowerCase();
            const text  = `${title}\n${body}`;

            // Steam client channel — detect stable and beta independently, then
            // apply only when exactly one is present.
            const isChannelBeta   = /\bbeta\s*\/\s*pre[-\s]?release\b/i.test(text) || /\bpre[-\s]?release\b/i.test(text);
            const isChannelStable = /steam client channel[\s\S]{0,120}\bstable\b/i.test(text) || /\bstable\b/i.test(text);

            const buckets = [
              { label: "OS::Bazzite",       patterns: [/\bbazzite\b/i] },
              { label: "OS::Chimera",       patterns: [/\bchimera\s*os\b/i, /\bchimeraos\b/i] },
              { label: "OS::MacOS",         patterns: [/\bmac\s*os\b/i, /\bmacos\b/i, /\bdarwin\b/i, /\bosx\b/i] },
              { label: "OS::Windows",       patterns: [/\bwindows\b/i, /\bwin(?:10|11|7|8)\b/i] },
              { label: "OS::SteamOS",       patterns: [/\bsteam\s*os\b/i, /\bsteamos\b/i, /\bvalve\s*os\b/i] },
              { label: "OS::OtherHoloISO",  patterns: [/\bholoiso\b/i] },
              // Host mode (ShelvesHub-specific)
              { label: "host::sole",        patterns: [/\bsole\b/i] },
              { label: "host::coexist",     patterns: [/\bcoexist\b/i] },
              { label: "host::cooperative", patterns: [/\bcooperative\b/i] },
            ];

            const toAdd = new Set();
            for (const { label, patterns } of buckets) {
              for (const p of patterns) {
                if (p.test(text)) { toAdd.add(label); break; }
              }
            }

            // Steam client channel: add exactly one when unambiguous.
            if (isChannelBeta && !isChannelStable) {
              toAdd.add("steam::beta");
            } else if (isChannelStable && !isChannelBeta) {
              toAdd.add("steam::stable");
            }

            // Fallback: a Steam Deck reference with no explicit OS means SteamOS.
            const hasOs = [...toAdd].some(l => l.startsWith("OS::"));
            if (!hasOs && /\bsteam\s*deck\b/i.test(text) && !/\bwindows\b|\bmacos\b|\bmac\s*os\b/i.test(text)) {
              toAdd.add("OS::SteamOS");
            }

            if (toAdd.size === 0) return [];

            const current = (context.payload.issue.labels ?? []).map(l => l.name);
            return [...toAdd].filter(l => !current.includes(l));

      - name: Apply labels
        if: steps.detect.outputs.result != '[]'
        uses: actions/github-script@v7
        env:
          LABELS: ${{ steps.detect.outputs.result }}
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: JSON.parse(process.env.LABELS),
            });
