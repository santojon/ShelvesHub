name: Build and Package for Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  windows:
    name: Build Windows Shelves Loader
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Rust for Windows
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Build Release Binary
      run: cargo build --release --target x86_64-pc-windows-msvc

    - name: Prepare Distribution
      run: |
        mkdir -p build/windows
        copy target\release\loader.exe build\windows
        copy installer\Windows\install.ps1 build\windows
        copy installer\Windows\shelves-loader.reg build\windows
        copy bundle build\windows /E

    - name: Package as ZIP
      run: |
        cd build/windows
        Compress-Archive -Path .\* -DestinationPath ..\..\shelves-loader-windows.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: shelves-loader-windows
        path: shelves-loader-windows.zip