name: Build and Package for Linux

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  linux:
    name: Build Linux Shelves Loader
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Build Release Binary
      run: cargo build --release

    - name: Prepare Distribution
      run: |
        mkdir -p build/linux
        cp target/release/loader build/linux/
        chmod +x build/linux/loader
        cp installer/Linux/shelves-loader.service build/linux/
        cp -r bundle build/linux/

    - name: Package as Tarball
      run: |
        cd build/linux
        tar -czf shelves-loader-linux.tar.gz *
        mv shelves-loader-linux.tar.gz ../../

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: shelves-loader-linux
        path: shelves-loader-linux.tar.gz