name: "Ops · Quality reports"

# Records a quality snapshot (every gate as a step: Rust tests, clippy, ESLint,
# the runtime harness, the daemon scenarios, lint and complexity debt, code lines) into
# site/reports/<scope>/<ts>.json and rebuilds the aggregate site/reports/runs.json
# the dashboard reads. Commits the snapshot back to main with SUBMIT_TOKEN (a PAT
# with push access), like Ops · Site stats — a failing run is recorded too, and
# the job then fails on the verdict.
#
# Scope: `release` for a published release, `ci` otherwise. The push trigger
# ignores site/reports/** so its own commit doesn't loop.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/reports/**'
  release:
    types: [published]
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 07:00 UTC — a recent weekly baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reports
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore(report)')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          token: ${{ secrets.SUBMIT_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # ESLint and its plugin come from the lockfile; without them the ESLint and
      # complexity steps would record "not measured" instead of a verdict.
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # A Chromium-family browser lets the report include the JS runtime harness
      # scenarios (the hub's JS test suite) alongside the Rust unit tests.
      - name: Set up Chrome (for the JS harness)
        id: chrome
        uses: browser-actions/setup-chrome@v1

      # Every gate as a recorded step (status, duration, log tail) + the parsed
      # signals: site/reports/<scope>/<ts>.json and .html. The script writes the
      # record before exiting 1 on a failed gate, so the commit step below still
      # runs and the red run reaches the dashboard; the verdict step fails the job.
      - name: Validate and record the run
        id: validate
        continue-on-error: true
        env:
          BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          HARNESS_NO_SANDBOX: '1'
          REPORT_SCOPE: ${{ github.event_name == 'release' && 'release' || 'ci' }}
        run: node scripts/validate.mjs --ci

      - name: Commit snapshot
        env:
          GH_TOKEN: ${{ secrets.SUBMIT_TOKEN || github.token }}
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # The report is generated against the checked-out ref, which on a release
          # can be a TAG cut from a branch that diverges from main. Committing on top
          # of that ref and rebasing onto main replays the tag's code and conflicts.
          # Instead, carry ONLY the new timestamped run file and re-apply it onto the
          # latest main, then rebuild the aggregate there — the commit's parent is
          # main, so it never conflicts with other work.
          # The run's JSON carries everything; the aggregate step regenerates its
          # page, the scope index and runs.json on top of main.
          REL="$(git status --porcelain site/reports | sed -n 's/^?? //p' | grep '\.json$' | grep -v runs.json | head -1)"
          if [ -z "$REL" ]; then
            echo "No new report file."
            exit 0
          fi
          TMP="$(mktemp -d)"; cp "$REL" "$TMP/run.json"
          for i in 1 2 3 4 5; do
            git fetch "$REMOTE" main
            git checkout -f FETCH_HEAD
            mkdir -p "$(dirname "$REL")"; cp "$TMP/run.json" "$REL"
            node scripts/ci/report.mjs --aggregate-only
            git add site/reports/
            if git diff --cached --quiet; then
              echo "No report change."
              exit 0
            fi
            git commit -m "chore(report): quality snapshot"
            if git push "$REMOTE" HEAD:main; then
              exit 0
            fi
            echo "Push rejected (main moved) — retrying ($i/5)…"
          done
          echo "Could not push the quality snapshot after retries."
          exit 1

      - name: Gate verdict
        if: steps.validate.outcome == 'failure'
        run: |
          echo "::error::a quality gate failed — the run was recorded above"
          exit 1
