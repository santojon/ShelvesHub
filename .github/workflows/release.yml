name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: shelveshub
            installer_dir: installer/SteamOS
            package: shelveshub-steamos.tar.gz
            oneclick_src: shelveshub.desktop
            oneclick_name: shelveshub.desktop
            oneclick_uninstall_src: uninstall.desktop
            oneclick_uninstall_name: uninstall-shelveshub.desktop

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: shelveshub
            installer_dir: installer/Linux
            package: shelveshub-linux.tar.gz
            oneclick_src: shelveshub.desktop
            oneclick_name: shelveshub-linux.desktop
            oneclick_uninstall_src: uninstall.desktop
            oneclick_uninstall_name: uninstall-shelveshub-linux.desktop

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: shelveshub
            installer_dir: installer/SteamOS
            package: shelveshub-steamos-aarch64.tar.gz
            oneclick_src: ""
            oneclick_name: ""
            oneclick_uninstall_src: ""
            oneclick_uninstall_name: ""

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: shelveshub
            installer_dir: installer/Linux
            package: shelveshub-linux-aarch64.tar.gz
            oneclick_src: ""
            oneclick_name: ""
            oneclick_uninstall_src: ""
            oneclick_uninstall_name: ""

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: shelveshub
            installer_dir: installer/macOS
            package: shelveshub-macos.tar.gz
            oneclick_src: install-mac.command
            oneclick_name: install-mac.command
            oneclick_uninstall_src: uninstall-mac.command
            oneclick_uninstall_name: uninstall-mac.command

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: shelveshub.exe
            installer_dir: installer/Windows
            package: shelveshub-windows.zip
            oneclick_src: install-windows.bat
            oneclick_name: install-windows.bat
            oneclick_uninstall_src: uninstall-windows.bat
            oneclick_uninstall_name: uninstall-windows.bat

    runs-on: ${{ matrix.os }}
    # Whole-job cap: a wedged apt/network step fails fast instead of burning the
    # 6h GitHub default (a build normally finishes in a few minutes).
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # @deck-shelves/host contract → HOST_API_VERSION (build.rs)

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The tag is the source of truth for the version: sync Cargo.toml so the
      # built binary reports the released version (env!("CARGO_PKG_VERSION")).
      - name: Sync crate version to the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          perl -0777 -pi -e "s/^version = \"[^\"]*\"/version = \"$V\"/m" Cargo.toml
          grep '^version' Cargo.toml

      # apt on the hosted runner can wedge waiting for the dpkg lock held by the
      # runner's own unattended-upgrades, or on a slow mirror. Bound the step, wait
      # for the lock, and retry instead of hanging the whole release for hours.
      - name: Install ARM64 cross compiler
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          for i in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu && break
            echo "apt attempt $i failed; freeing any dpkg lock and retrying..."
            sudo fuser -k /var/lib/dpkg/lock-frontend 2>/dev/null || true
            sleep 15
          done
          command -v aarch64-linux-gnu-gcc >/dev/null || { echo "::error::aarch64 cross compiler install failed"; exit 1; }

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      # macOS ships a UNIVERSAL binary so it runs on both Apple Silicon and Intel
      # Macs. The step above built the matrix's arm64 slice; also build the x86_64
      # slice and `lipo` the two together in place, so the Package step below picks
      # up the fat binary unchanged. Fails the job if the result isn't universal.
      - name: macOS universal binary (arm64 + x86_64)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          for b in shelveshub shelves-devtools; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$b" \
              "target/x86_64-apple-darwin/release/$b" \
              -output "target/aarch64-apple-darwin/release/$b"
            archs="$(lipo -archs "target/aarch64-apple-darwin/release/$b")"
            echo "$b arches: $archs"
            case "$archs" in
              *x86_64*arm64* | *arm64*x86_64*) ;;
              *) echo "::error::$b is not a universal binary ($archs)"; exit 1 ;;
            esac
          done

      # Optional tray companion. Built everywhere EXCEPT aarch64 Linux, where the
      # GTK3/appindicator cross-build isn't practical yet — those packages simply
      # omit it and the installer's opt-in degrades to "not bundled". macOS lipos
      # the two slices like the daemon; Linux x86_64 needs the GTK dev headers.
      - name: Build tray companion
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          fi
          cargo build --release --features tray --bin shelveshub-tray --target ${{ matrix.target }}
          if [ "$RUNNER_OS" = "macOS" ]; then
            rustup target add x86_64-apple-darwin
            cargo build --release --features tray --bin shelveshub-tray --target x86_64-apple-darwin
            lipo -create \
              "target/aarch64-apple-darwin/release/shelveshub-tray" \
              "target/x86_64-apple-darwin/release/shelveshub-tray" \
              -output "target/aarch64-apple-darwin/release/shelveshub-tray"
          fi

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/bundle dist/runtime dist/installer dist/assets/boot
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp target/${{ matrix.target }}/release/shelves-devtools dist/
          # Tray companion when it was built for this target (not aarch64 Linux).
          [ -f target/${{ matrix.target }}/release/shelveshub-tray ] && cp target/${{ matrix.target }}/release/shelveshub-tray dist/ || true
          cp shelveshub.config.json dist/
          cp assets/boot/deck_startup.webm assets/boot/deck_startup_1280x800.webm dist/assets/boot/
          cp -r bundle/. dist/bundle/
          cp -r runtime/. dist/runtime/
          cp -r ${{ matrix.installer_dir }}/. dist/installer/
          cd dist && tar -czf ../${{ matrix.package }} .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\bundle, dist\runtime, dist\installer, dist\assets\boot | Out-Null
          Copy-Item target\${{ matrix.target }}\release\${{ matrix.binary }} dist\
          Copy-Item target\${{ matrix.target }}\release\shelves-devtools.exe dist\
          if (Test-Path target\${{ matrix.target }}\release\shelveshub-tray.exe) { Copy-Item target\${{ matrix.target }}\release\shelveshub-tray.exe dist\ }
          Copy-Item shelveshub.config.json dist\
          Copy-Item assets\boot\deck_startup.webm, assets\boot\deck_startup_1280x800.webm dist\assets\boot\
          Copy-Item -Recurse bundle\* dist\bundle\
          Copy-Item -Recurse runtime\* dist\runtime\
          Copy-Item -Recurse ${{ matrix.installer_dir }}\* dist\installer\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.package }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}

      - name: Prepare one-click installer (Linux / macOS)
        if: runner.os != 'Windows' && matrix.oneclick_src != ''
        run: cp ${{ matrix.installer_dir }}/${{ matrix.oneclick_src }} ${{ matrix.oneclick_name }}

      - name: Prepare one-click installer (Windows)
        if: runner.os == 'Windows' && matrix.oneclick_src != ''
        shell: pwsh
        run: Copy-Item ${{ matrix.installer_dir }}\${{ matrix.oneclick_src }} ${{ matrix.oneclick_name }}

      - name: Upload one-click installer artifact
        if: matrix.oneclick_src != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.oneclick_name }}
          path: ${{ matrix.oneclick_name }}

      - name: Prepare one-click uninstaller (Linux / macOS)
        if: runner.os != 'Windows' && matrix.oneclick_uninstall_src != ''
        run: cp ${{ matrix.installer_dir }}/${{ matrix.oneclick_uninstall_src }} ${{ matrix.oneclick_uninstall_name }}

      - name: Prepare one-click uninstaller (Windows)
        if: runner.os == 'Windows' && matrix.oneclick_uninstall_src != ''
        shell: pwsh
        run: Copy-Item ${{ matrix.installer_dir }}\${{ matrix.oneclick_uninstall_src }} ${{ matrix.oneclick_uninstall_name }}

      - name: Upload one-click uninstaller artifact
        if: matrix.oneclick_uninstall_src != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.oneclick_uninstall_name }}
          path: ${{ matrix.oneclick_uninstall_name }}

      # ── GUI installers with the app icon (clickable) ────────────────────────
      - name: Build macOS installer app
        if: runner.os == 'macOS'
        run: |
          [ -f assets/icons/icon.icns ] || { brew install librsvg; python3 -m pip install --quiet --break-system-packages pillow; }
          bash scripts/build-mac-app.sh "$PWD/dist-app"

      - name: Upload macOS installer app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Install-ShelvesHub-app
          path: dist-app/Install ShelvesHub.app.zip

      - name: Build Windows installer (NSIS)
        if: runner.os == 'Windows'
        # Non-fatal: the .zip package and one-click installer still ship if the
        # optional NSIS .exe build ever fails, so it never blocks the release.
        continue-on-error: true
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force nsis\payload | Out-Null
          Copy-Item dist\* nsis\payload\ -Recurse -Force
          Copy-Item installer\Windows\register-task.ps1 nsis\payload\ -Force
          Copy-Item installer\Windows\apply-setup.ps1 nsis\payload\ -Force
          Copy-Item installer\Windows\migrate.ps1 nsis\payload\ -Force
          Copy-Item installer\Windows\shelveshub.nsi nsis\ -Force
          Copy-Item assets\icons\icon.ico nsis\icon.ico -Force
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" nsis\shelveshub.nsi

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shelveshub-setup.exe
          path: nsis\shelveshub-setup.exe

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # A SemVer pre-release tag carries a `-` suffix (e.g. v1.2.3-beta.1) —
          # mark the GitHub release as a pre-release so it stays off the "latest"
          # channel and self-update only offers it when the beta channel is on.
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Extract release notes
        id: notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          NOTES=""
          # Prefer a section matching the released version, then fall back to the
          # "Unreleased" section (used while no versioned section exists yet).
          for SECTION in "${VERSION}" "Unreleased"; do
            if [[ -z "$NOTES" && -f "RELEASE_NOTES.md" ]]; then
              NOTES=$(awk "/^## \\[${SECTION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" RELEASE_NOTES.md | sed '/^$/N;/^\n$/d')
            fi
            if [[ -z "$NOTES" && -f "CHANGELOG.md" ]]; then
              NOTES=$(awk "/^## \\[${SECTION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md | sed '/^$/N;/^\n$/d')
            fi
          done
          {
            echo "body<<BODY_EOF"
            printf '%s\n' "$NOTES"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Checksums + minisign signature
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cd artifacts
          # SHA256SUMS over every release file, listed by basename (the asset name
          # the daemon verifies against). Excludes the sums/sig files themselves.
          : > SHA256SUMS
          find . -type f ! -name 'SHA256SUMS' ! -name 'SHA256SUMS.minisig' -print0 \
            | while IFS= read -r -d '' f; do
                printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" >> SHA256SUMS
              done
          sort -k2 -o SHA256SUMS SHA256SUMS
          echo "== SHA256SUMS =="; cat SHA256SUMS
          # Sign with minisign when the CI secret is configured; otherwise publish
          # the sums unsigned (the daemon then verifies the hash but logs that the
          # signature was unavailable). Set MINISIGN_SECRET_KEY + MINISIGN_PASSWORD
          # (from `minisign -G`) to enable tamper-proof signature verification.
          if [ -n "${MINISIGN_SECRET_KEY:-}" ]; then
            sudo systemctl stop unattended-upgrades 2>/dev/null || true
            for i in 1 2 3 4 5; do
              sudo apt-get update -qq && sudo apt-get install -y -qq minisign && break
              sudo fuser -k /var/lib/dpkg/lock-frontend 2>/dev/null || true; sleep 15
            done
            command -v minisign >/dev/null || { echo "::error::minisign install failed"; exit 1; }
            printf '%s\n' "$MINISIGN_SECRET_KEY" > mkey
            # Validate the key FILE shape without printing it: a minisign secret key
            # is two lines — an "untrusted comment:" line then the base64 key. A
            # secret set to only the base64 line (comment omitted on paste) fails to
            # load with "Error while loading the secret key file".
            if [ "$(grep -c . mkey)" -lt 2 ] || ! head -1 mkey | grep -q 'untrusted comment:'; then
              rm -f mkey
              echo "::error::MINISIGN_SECRET_KEY is not a valid minisign secret-key file. Re-set the secret to the FULL content of your minisign.key (BOTH lines: the 'untrusted comment:' line AND the base64 line). If the key is password-protected, also set MINISIGN_PASSWORD."
              exit 1
            fi
            printf '%s\n' "${MINISIGN_PASSWORD:-}" | minisign -S -s mkey -m SHA256SUMS -x SHA256SUMS.minisig || {
              rm -f mkey
              echo "::error::minisign signing failed. If your key is password-protected, set the MINISIGN_PASSWORD secret; otherwise re-generate a passwordless key (minisign -G -W) and update MINISIGN_SECRET_KEY + the embedded MINISIGN_PUBLIC_KEY in src/constants.rs."
              exit 1
            }
            rm -f mkey
            echo "SHA256SUMS signed with minisign."
          else
            echo "MINISIGN_SECRET_KEY not set — publishing SHA256SUMS without a signature."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # SUBMIT_TOKEN (a PAT) so publishing the release emits a
          # `release: published` event that triggers the announce workflow.
          # A release created with the default GITHUB_TOKEN does not trigger
          # other workflows. Falls back to GITHUB_TOKEN when the PAT is unset.
          token: ${{ secrets.SUBMIT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ShelvesHub ${{ steps.tag.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.body == '' }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          # `artifacts/**/*` already includes SHA256SUMS + SHA256SUMS.minisig (both
          # live in artifacts/). Listing them again made action-gh-release process
          # them twice -> a clobber/label-update race that 404'd AND dropped the
          # plain SHA256SUMS from the release. One glob, each asset uploaded once.
          files: |
            artifacts/**/*
