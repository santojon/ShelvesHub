name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Full gate (format + check + test + clippy) on the Unix targets, where the
  # unit tests' filesystem/path assumptions hold.
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # Windows is compile-validated (check + clippy) but not unit-tested here — the
  # daemon builds on Windows (see build.yml) and Windows releases ship without a
  # dedicated hardware test for now; a real Windows install test is tracked
  # separately.
  windows-check:
    runs-on: windows-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # Dependency vulnerability audit. Non-blocking history: keep it green by
  # bumping advised crates; a real advisory should fail the build.
  audit:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit

  # Runtime syntax + data-file validation.
  docs-and-runtime:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Runtime JavaScript syntax
        run: node --check runtime/shelves-host.js

      - name: Validate JSON data files (i18n + shipped config)
        run: |
          python3 - <<'PY'
          import json, glob, sys
          bad = []
          for f in glob.glob("runtime/i18n/*.json") + ["shelveshub.config.json"]:
              try:
                  json.load(open(f, encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("Invalid JSON:\n" + "\n".join(bad)); sys.exit(1)
          print("All JSON data files valid.")
          PY

      - name: i18n key parity (every locale carries the en-US keys)
        run: |
          python3 - <<'PY'
          import json, glob, os, sys
          base = json.load(open("runtime/i18n/en-US.json", encoding="utf-8"))
          keys = set(base)
          missing = {}
          for f in glob.glob("runtime/i18n/*.json"):
              d = json.load(open(f, encoding="utf-8"))
              gap = keys - set(d)
              if gap:
                  missing[os.path.basename(f)] = sorted(gap)
          if missing:
              for loc, gap in missing.items():
                  print(f"{loc} missing: {gap}")
              sys.exit(1)
          print("i18n key parity: OK.")
          PY

  # Compatibility: the daemon's HOST_API_VERSION is derived from the shared
  # @deck-shelves/host contract at build time (build.rs). Assert the submodule is
  # present and the derived version is NOT the fallback, so a missing submodule or
  # a drifted contract fails CI instead of shipping a wrong compatibility number.
  contract:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Contract present and version derivable
        run: |
          # Read the committed contract SOURCE, not the built dist/index.d.ts —
          # dist/ is a build artifact the submodule does not commit, so a plain
          # `submodules: recursive` checkout never has it (build.rs reads dist too
          # but falls back gracefully; this job asserts the source is present).
          SRC=host/src/contract/index.ts
          test -f "$SRC" || { echo "::error::$SRC missing — @deck-shelves/host submodule not checked out"; exit 1; }
          V=$(grep -E "HOST_API_VERSION" "$SRC" | head -1 | sed -E 's/[^"]*"([^"]+)".*/\1/')
          echo "Contract HOST_API_VERSION = $V"
          test -n "$V" || { echo "::error::could not extract HOST_API_VERSION from the contract"; exit 1; }

  # Cross-platform simulation harness: build + run the daemon, the runtime
  # scenarios, and the install/uninstall lifecycle against a headless Chromium in
  # a clean Linux container (x86_64 here; arm64 is available locally via
  # `PLATFORM=linux/arm64 scripts/harness-docker.sh` with QEMU/buildx). The
  # Windows/macOS builds ride the matrices above — Windows containers can't run
  # on a Linux runner.
  docker-harness:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      # Check out the plugin so the harness can exercise its cross-OS backend
      # probes UNDER the host. Non-fatal: if it can't be reached the harness's
      # plugin step just skips and the host-only checks still run.
      - name: Check out Deck Shelves (plugin-under-host probes)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: santojon/Deck-Shelves
          path: .plugin-src
          persist-credentials: false
          token: ${{ secrets.SUBMIT_TOKEN || github.token }}

      - name: Simulation harness (Linux container)
        run: DECK_SHELVES_ROOT="$GITHUB_WORKSPACE/.plugin-src" bash scripts/harness-docker.sh

      # The same plugin probes on ARM64 (QEMU) — the coverage the plugin's own
      # x86_64 pytest can't give. Probes only (no Rust build), so it stays cheap.
      - name: Set up QEMU (arm64)
        if: hashFiles('.plugin-src/src/backend/display_state.py') != ''
        uses: docker/setup-qemu-action@v3
      - name: Plugin backend probes on ARM64
        if: hashFiles('.plugin-src/src/backend/display_state.py') != ''
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE/docker/plugin-probes.py":/probes.py:ro \
            -v "$GITHUB_WORKSPACE/.plugin-src":/deck-shelves:ro \
            -e DECK_SHELVES_ROOT=/deck-shelves \
            python:3-slim python3 /probes.py

  # Prove every change compiles for Linux ARM64 (Steam Frame / ARM boxes). Cheap:
  # a native cross-compile with the ARM64 linker — no emulation — so it gates every
  # PR. The full emulated ARM64 runtime harness is docker-harness-arm64 below.
  linux-arm64-check:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-arm64-

      - name: Install ARM64 linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: ARM64 check + release build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo check --all-targets --target aarch64-unknown-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu

  # The full simulation harness on REAL emulated ARM64 (QEMU) — the daemon,
  # runtime scenarios and injection smoke actually running, not just compiling.
  # A cargo release build under emulation is slow, so this is manual-dispatch only
  # (linux-arm64-check gates every PR); run it before promoting "Linux ARM64
  # supported" or ahead of a release.
  docker-harness-arm64:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Simulation harness (ARM64 container)
        env:
          PLATFORM: linux/arm64
          IMAGE: shelveshub-harness-arm64
        run: bash scripts/harness-docker.sh
