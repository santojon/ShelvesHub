<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>shelveshub-harness</title>
    <script>
      // Map ?scenario= to the mock/orchestration flags. Must run BEFORE the mock
      // (the mock reads window.__HARNESS__ at load to install the loader stub).
      (function () {
        var sc = new URLSearchParams(location.search).get("scenario") || "coexist-mirror";
        var map = {
          "coexist-mirror": { coexist: true, pluginPanel: true },
          "coexist-fallback": { coexist: true, pluginPanel: false },
          "sole-host": { coexist: false },
          "sole-host-mirror": { coexist: false, pluginPanel: true },
          "sole-host-fallback": { coexist: false, pluginPanel: false },
          "coexist-late": { coexist: true, pluginPanel: true, lateMount: true },
          "coexist-native": { coexist: true, pluginPanel: true, nativeUi: true },
          "coexist-fallback-native": { coexist: true, pluginPanel: false, nativeUi: true },
          "coexist-idle": { coexist: true, pluginPanel: true, nativeUi: true },
          // Cooperative: a loader is present AND ownership is forced to ShelvesHub
          // (SHELVES_FORCE_OWNER=shelveshub) — the host is published, the UI borrowed.
          "coop-mirror": { coexist: true, pluginPanel: true, forceOwner: true },
          "coop-fallback": { coexist: true, pluginPanel: false, forceOwner: true },
          // Cooperative bundle: the hub carries its own copy (config `coopBundle`) and the
          // loader's copy stood down (its defer signal), so the running copy is the hub's.
          "coop-bundle": { coexist: true, pluginPanel: true, forceOwner: true, coopBundle: true },
          // Steam's language in the renderer URL (the driver appends LANGUAGE=brazilian)
          // picks the real pt-BR dictionary over navigator.language.
          "sole-host-locale": { coexist: false, pluginPanel: false, locale: "pt-BR" },
          // The hub view's configuration stepper against the daemon's ranges and a refused edit.
          "sole-host-config": { coexist: false, pluginPanel: false },
          // Hub view interactions: the log sidecar (menu widening) and the
          // notification center (toast → hub view → Steam's Notifications tab).
          "sole-host-sidecar": { coexist: false, pluginPanel: false },
          "sole-host-status": { coexist: false, pluginPanel: false },
          "sole-host-notify": { coexist: false, pluginPanel: false, nativeNotifications: true },
          // The sidecar opened without a pointer: two D-pad rights on the rightmost
          // focusable (the controller input stream), then a keyboard shortcut.
          "sole-host-gesture": { coexist: false, pluginPanel: false },
          // Steam unmounts a tab's panel when another tab is picked: the hub view opened from
          // the editor must come back with the tab, and its gestures with it.
          "sole-host-tabswitch": { coexist: false, pluginPanel: true, tabSwitch: true },
        };
        window.__HARNESS__ = map[sc] || map["coexist-mirror"];
        // Native-component rendering is gated behind this runtime flag on-device
        // (see nativeUiOn()); scenarios that provide native mocks opt in here so
        // the harness exercises the native render path.
        if (window.__HARNESS__.nativeUi) window.__SHELVES_NATIVE_UI__ = true;
        // What the daemon stamps before injecting under a forced owner.
        if (window.__HARNESS__.forceOwner) window.__SHELVES_FORCE_OWNER__ = "shelveshub";
        if (window.__HARNESS__.nativeNotifications) window.__SHELVES_NATIVE_NOTIFICATIONS__ = true;
        // The daemon's config stamp with the cooperative-bundle protocol on, plus the defer
        // signal a stood-down loader copy publishes before the hub's copy boots.
        if (window.__HARNESS__.coopBundle) {
          window.__SHELVES_CONFIG__ = { coopBundle: true };
          window.__DECK_SHELVES_DEFER_TO_HOST__ = { loaderVersion: "0.0.0", hostBundleVersion: "0.0.1", at: Date.now() };
        }
        // The menu-widening protocol goes to the QAM document's opener; capture it
        // here so the sidecar scenario can assert the messages.
        window.__HARNESS_COMPOSITOR__ = [];
        try { window.opener = { postMessage: function (m) { window.__HARNESS_COMPOSITOR__.push(m && m.message); } }; } catch (e) {}
        window.__HARNESS_SCENARIO__ = sc;
        window.__HARNESS_READY__ = false;
        window.__HARNESS_ERRORS__ = [];
        window.addEventListener("error", function (e) {
          window.__HARNESS_ERRORS__.push(String((e && (e.message || e.error)) || e));
        });

        // Idle-cost instrumentation (must wrap before the mock/runtime create anything):
        // track LIVE repeating timers (handle -> interval ms) and MutationObservers so the
        // coexist-idle scenario can assert no permanent sub-1s poll / observer churn after settle.
        (function () {
          var idle = { intervals: 0, observers: 0, intervalTicks: 0, observerCbs: 0, live: {} };
          window.__HARNESS_IDLE__ = idle;
          var _si = window.setInterval.bind(window), _ci = window.clearInterval.bind(window);
          window.setInterval = function (fn, ms) {
            var h = _si(function () { idle.intervalTicks++; try { return fn.apply(this, arguments); } catch (e) {} }, ms);
            idle.live[h] = ms || 0; idle.intervals++; return h;
          };
          window.clearInterval = function (h) {
            if (Object.prototype.hasOwnProperty.call(idle.live, h)) { delete idle.live[h]; idle.intervals--; }
            return _ci(h);
          };
          var MO = window.MutationObserver;
          if (MO) {
            var Wrapped = function (cb) {
              var o = new MO(function () { idle.observerCbs++; try { return cb.apply(this, arguments); } catch (e) {} });
              var obs = o.observe.bind(o), dis = o.disconnect.bind(o), on = false;
              o.observe = function () { if (!on) { on = true; idle.observers++; } return obs.apply(o, arguments); };
              o.disconnect = function () { if (on) { on = false; idle.observers--; } return dis.apply(o, arguments); };
              return o;
            };
            Wrapped.prototype = MO.prototype;
            window.MutationObserver = Wrapped;
          }
        })();

        // The daemon's RPC endpoint is stubbed by steam-mock.js (canned getConfig /
        // getRuntimeConfig / getLogs answers), so the fallback panel renders without a daemon.
      })();
    </script>
    <script src="vendor/react.js"></script>
    <script src="vendor/react-dom.js"></script>
    <script src="steam-mock.js"></script>
    <script src="orchestrate.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
