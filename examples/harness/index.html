<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelves Loader — Local CEF Harness</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #1a1d23;
        color: #e6e8eb;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h2 { font-size: 15px; color: #9aa3ad; margin: 20px 0 8px; }
      pre { background: #11141a; padding: 10px; border-radius: 6px; font-size: 12px; color: #8fd3a0; }
      button {
        background: #2a2f3a; color: #e6e8eb; border: 1px solid #3a4150;
        border-radius: 6px; padding: 10px 14px; cursor: pointer; font-size: 13px;
      }
      button:hover { background: #353c49; }
      #status { font-size: 12px; color: #6b7280; margin-bottom: 16px; }
    </style>
  </head>
  <body>
    <div id="status">
      Local CEF harness. The Steam environment is stubbed; inject the example
      bundle with the loader or <code>shelves-devtools inject</code> and it will
      render below.
    </div>

    <!-- The injected bundle renders into this node (it also creates it if absent). -->
    <div id="shelves-root">
      <p>Waiting for bundle injection…</p>
    </div>

    <!-- Provides window.SteamClient + window.__SHELVES_HOST__ before injection. -->
    <script src="steam-stubs.js"></script>
  </body>
</html>
